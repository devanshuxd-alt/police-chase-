<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Created by Devanshu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: one portrait stage centred on a hazard-tape ground; HUD as street-sign plates; everything scales with the stage font-size. */
:root{
  --night:#0b0a18;
  --plate:rgba(16,13,38,.88);
  --amber:#ffc24a;
  --red:#ff3d52;
  --blue:#3f8cff;
  --paper:#f4ead2;
  --mute:#a99fcf;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--paper);overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,194,74,.06) 0 22px,transparent 22px 44px);pointer-events:none}
#stage{position:relative;z-index:1;overflow:hidden;background:#150f35;touch-action:none;box-shadow:0 0 0 2px rgba(255,194,74,.35),0 24px 80px rgba(0,0,0,.65)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:.14em solid var(--paper);outline-offset:.12em}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#stage[data-mode="play"] #hud,#stage[data-mode="pause"] #hud,#stage[data-mode="dying"] #hud{display:block}
.lbl{font-weight:600;font-size:.62em;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.hud-l{position:absolute;left:.9em;top:.9em;display:flex;flex-direction:column;gap:.45em;align-items:flex-start}
.plate{background:var(--plate);border-left:.25em solid var(--amber);padding:.3em .8em .15em .6em;border-radius:.15em;display:flex;flex-direction:column;line-height:1}
.plate b{font-family:var(--display);font-weight:800;font-size:2.3em;font-variant-numeric:tabular-nums;line-height:.95;min-width:2.4em}
.chips{display:flex;gap:.45em}
.chips span{background:var(--plate);padding:.28em .6em .2em;border-radius:.15em;font-weight:600;font-size:.85em;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.chips #hLoot{color:var(--amber)}
.heat{display:flex;align-items:center;gap:.35em;background:var(--plate);padding:.3em .6em .25em;border-radius:.15em}
.heat i{width:.9em;height:.6em;border-radius:.1em;background:#2b2748;display:block}
.heat i.on:nth-of-type(odd){background:var(--red);box-shadow:0 0 .6em var(--red)}
.heat i.on:nth-of-type(even){background:var(--blue);box-shadow:0 0 .6em var(--blue)}
.pws{display:flex;flex-direction:column;gap:.3em}
.pw{display:none;align-items:center;gap:.5em;background:var(--plate);padding:.25em .6em;border-radius:.15em;font-weight:600;font-size:.78em;letter-spacing:.1em;text-transform:uppercase;min-width:9.5em}
.pw u{flex:1;height:.4em;background:#2b2748;border-radius:.2em;overflow:hidden;display:block}
.pw s{display:block;height:100%;width:100%;transform-origin:left;background:var(--amber)}
.pw[data-k="magnet"] s{background:#ff6677}
.pw[data-k="shield"] s{background:#56c8ff}
.hud-r{position:absolute;right:.9em;top:.9em;display:flex;gap:.45em}
.hud-r button{pointer-events:auto;width:2.5em;height:2.5em;border:0;border-radius:.2em;background:var(--plate);display:flex;align-items:center;justify-content:center;gap:.22em;font-weight:600;font-size:.7em;letter-spacing:.06em}
.hud-r button .bar{width:.28em;height:1.1em;background:var(--paper);display:block;border-radius:.05em}
#bSnd[aria-pressed="false"]{color:var(--mute);text-decoration:line-through}

/* banner */
#banner{position:absolute;left:0;right:0;top:31%;text-align:center;pointer-events:none;opacity:0;padding:.35em 0 .4em;background:linear-gradient(90deg,transparent,var(--plate) 18%,var(--plate) 82%,transparent)}
#banner b{display:block;font-family:var(--display);font-weight:900;font-size:3em;letter-spacing:.06em;text-transform:uppercase;line-height:1}
#banner span{display:block;font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:.8em;color:var(--amber)}
#banner.show{animation:ban 2.3s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translateY(.6em) scale(.94)}10%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}

/* screens */
.screen{position:absolute;inset:0;display:none;pointer-events:none}
#stage[data-mode="menu"] #menu,#stage[data-mode="over"] #over,#stage[data-mode="pause"] #pause{display:block}
.screen button{pointer-events:auto}
h1{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.78;letter-spacing:.02em;animation:siren .9s steps(1,end) infinite}
h1 span{display:block;width:max-content;margin:0 auto;white-space:nowrap}
h1 .a{font-size:5.6em;color:var(--paper)}
h1 .b{font-size:6.8em;color:var(--amber)}
@keyframes siren{0%{text-shadow:-.06em 0 .3em var(--red),0 .05em 0 #000}50%{text-shadow:.06em 0 .3em var(--blue),0 .05em 0 #000}}
#menu .title{position:absolute;left:0;right:0;top:6%;text-align:center}
.tag{margin:1em auto 0;max-width:92%;text-wrap:balance;font-weight:600;font-size:.85em;letter-spacing:.1em;line-height:1.35;text-transform:uppercase;color:var(--paper);text-shadow:0 .08em .3em #000}
#menu .cta{position:absolute;left:0;right:0;top:46%;display:flex;flex-direction:column;align-items:center;gap:.8em}
.primary{background:var(--amber);color:#1a1226;border:0;border-radius:.14em;font-family:var(--display);font-weight:900;font-size:2em;letter-spacing:.06em;text-transform:uppercase;padding:.28em 1.5em .2em;box-shadow:0 .1em 0 #a8700f,0 .5em 1.4em rgba(0,0,0,.5)}
.primary:active{transform:translateY(.08em);box-shadow:0 .02em 0 #a8700f}
.ghost{background:transparent;border:.1em solid rgba(244,234,210,.5);border-radius:.14em;font-family:var(--display);font-weight:800;font-size:1.5em;letter-spacing:.06em;text-transform:uppercase;padding:.2em 1em .12em;color:var(--paper)}
.bestplate{background:var(--plate);padding:.3em .9em .2em;border-radius:.15em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.85em}
.bestplate b{font-family:var(--display);font-size:1.5em;color:var(--amber);margin-left:.4em;font-variant-numeric:tabular-nums}
.keys{position:absolute;left:0;right:0;bottom:3%;display:flex;flex-direction:column;align-items:center;gap:.6em}
.keys .row{display:flex;gap:.5em}
.keys .row span{background:var(--plate);border-radius:.15em;padding:.3em .7em .22em;font-weight:600;font-size:.85em;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.keys .row span b{color:var(--amber);margin-right:.35em}
.keys p{margin:0;padding:0 6%;text-align:center;line-height:1.5;font-weight:600;font-size:.75em;letter-spacing:.12em;text-transform:uppercase;color:var(--paper);text-shadow:0 .1em .3em #000}

.card{position:absolute;left:8%;right:8%;top:50%;transform:translateY(-50%);background:var(--plate);padding:0 1.4em 1.4em;border-radius:.15em;box-shadow:0 1em 3em rgba(0,0,0,.6);pointer-events:auto}
.card::before{content:"";display:block;height:.5em;margin:0 -1.4em 1.1em;background:repeating-linear-gradient(-45deg,var(--amber) 0 .55em,#14101f .55em 1.1em)}
.card h2{margin:0;font-family:var(--display);font-weight:900;font-size:5.2em;line-height:.85;letter-spacing:.03em;text-transform:uppercase;color:var(--paper);text-shadow:-.04em 0 0 var(--blue),.04em 0 0 var(--red)}
.card .case{margin:.6em 0 0;font-weight:600;font-size:.8em;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card dl{margin:1em 0 1.2em;display:grid;gap:.3em}
.card .r{display:flex;align-items:baseline;gap:.6em}
.card dt{font-weight:600;font-size:.82em;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.card .r i{flex:1;border-bottom:.12em dotted rgba(255,255,255,.22);transform:translateY(-.3em)}
.card dd{margin:0;font-family:var(--display);font-weight:800;font-size:1.7em;font-variant-numeric:tabular-nums}
.card .r.big dd{color:var(--amber);font-size:2.3em}
.card .rec{display:none;margin-top:.2em;font-weight:600;font-size:.8em;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.card .rec.show{display:block}
.card .btns{display:flex;gap:.7em;align-items:center}
.card .btns .primary{font-size:1.7em;flex:1;white-space:nowrap;padding-left:.6em;padding-right:.6em}
.card .btns .ghost{white-space:nowrap}
.pause-card h2{font-size:3.6em;text-shadow:none}
.pause-card .btns{margin-top:1.2em}

@media (prefers-reduced-motion:reduce){
  h1{animation:none;text-shadow:0 .05em 0 #000}
  #banner.show{animation-duration:2.3s;animation-name:banfade}
  @keyframes banfade{0%{opacity:0}10%{opacity:1}78%{opacity:1}100%{opacity:0}}
}
</style>
</head>
<body>
<div id="stage" data-mode="menu">
  <canvas id="c" aria-label="Siren Run game"></canvas>

  <div id="hud">
    <div class="hud-l">
      <div class="plate"><span class="lbl">Score</span><b id="hScore">0</b></div>
      <div class="chips"><span id="hDist">0 m</span><span id="hLoot">$0</span></div>
      <div class="heat" id="hHeat"><span class="lbl">Heat</span><i></i><i></i><i></i><i></i><i></i></div>
      <div class="pws">
        <div class="pw" data-k="magnet"><span>Magnet</span><u><s></s></u></div>
        <div class="pw" data-k="shield"><span>Shield</span><u><s></s></u></div>
        <div class="pw" data-k="nitro"><span>Nitro</span><u><s></s></u></div>
      </div>
    </div>
    <div class="hud-r">
      <button id="bSnd" type="button" aria-label="Sound" aria-pressed="true">SFX</button>
      <button id="bPause" type="button" aria-label="Pause"><span class="bar"></span><span class="bar"></span></button>
    </div>
  </div>

  <div id="banner" aria-live="polite"><b></b><span></span></div>

  <section id="menu" class="screen">
    <div class="title">
      <h1><span class="a">Siren</span><span class="b">Run</span></h1>
      <p class="tag">Grab the loot. Stay ahead of the law.</p>
    </div>
    <div class="cta">
      <button id="bPlay" class="primary" type="button">Start run</button>
      <div class="bestplate">Best<b id="mBest">0</b></div>
    </div>
    <div class="keys">
      <div class="row"><span><b>&larr; &rarr;</b>Lanes</span><span><b>&uarr;</b>Jump</span><span><b>&darr;</b>Slide</span></div>
      <p>Swipe on a phone<br>Arrow keys or WASD on a keyboard</p>
    </div>
  </section>

  <section id="pause" class="screen">
    <div class="card pause-card">
      <h2>Paused</h2>
      <div class="btns"><button id="bResume" class="primary" type="button">Resume</button><button id="bQuit" class="ghost" type="button">Quit</button></div>
    </div>
  </section>

  <section id="over" class="screen">
    <div class="card">
      <h2>Busted</h2>
      <p class="case" id="oCase">Booking no. 0000 &middot; Grand theft, on foot</p>
      <dl>
        <div class="r"><dt>Distance</dt><i></i><dd id="oDist">0 m</dd></div>
        <div class="r"><dt>Loot</dt><i></i><dd id="oLoot">$0</dd></div>
        <div class="r"><dt>Heat reached</dt><i></i><dd id="oHeat">1</dd></div>
        <div class="r big"><dt>Score</dt><i></i><dd id="oScore">0</dd></div>
        <div class="r"><dt>Best</dt><i></i><dd id="oBest">0</dd></div>
        <div class="rec" id="oRec">New personal best</div>
      </dl>
      <div class="btns"><button id="bAgain" class="primary" type="button">Run again</button><button id="bMenu" class="ghost" type="button">Menu</button></div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';

/* ================= constants ================= */
const W = 540, CX = W / 2, F = 270, D_P = 300, LANE_W = 150, ROAD_HALF = 225;
const GRAV = 3300, JUMP_V = 900, SPAWN_D = 4300, SEG = 240;
const MAGNET_T = 9, NITRO_T = 5, SHIELD_T = 20;
let H = 960, HOR = 326, CAMH = 512, GROUND_Y = 787, camX = 0, scale = 1, stageW = 540;

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), stage = $('stage');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const ri = n => Math.floor(Math.random() * n);
const pick = a => a[ri(a.length)];
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE = window.matchMedia && matchMedia('(pointer: coarse)').matches;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = amt < 0 ? 0 : 255, a = Math.abs(amt);
  r = Math.round((f - r) * a + r); g = Math.round((f - g) * a + g); b = Math.round((f - b) * a + b);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
const pal = hex => ({ f: hex, t: shade(hex, .22), s: shade(hex, -.3) });
function hsh(a, b, c) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ================= state ================= */
let best = 0;
try { best = +localStorage.getItem('sirenrun_best') || 0; } catch (e) {}
let muted = false;

const newPlayer = () => ({ x: 0, lane: 0, y: 0, vy: 0, slide: 0, h: 175, tilt: 0, inv: 0, anim: 0, fall: 0, jumpBuf: 0, qSlide: false });
const S = {
  mode: 'menu', t: 0, travel: 0, speed: 900, dist: 0, coins: 0, bonus: 0, score: 0,
  heat: 1, maxHeat: 1, p: newPlayer(), ents: [], parts: [],
  blds: { '-1': [], '1': [] }, lamps: [],
  copD: 255, copX: 0, copClose: false, copTimer: 0,
  shield: 0, magnet: 0, nitro: 0, shake: 0, flash: 0, flashCol: '255,60,80',
  spawnCD: 0, lastClear: 0, puCD: 3000, combo: 0, comboT: 0, dyingT: 0, autoT: 0, overAt: 0, tut: true, spotX: 270
};

/* ================= layout ================= */
let lastW = 0, lastH = 0, skyG, groundG, vigG;
function fit() {
  const aw = window.innerWidth || document.documentElement.clientWidth || 390;
  const ah = window.innerHeight || document.documentElement.clientHeight || 844;
  lastW = aw; lastH = ah;
  H = Math.round(clamp(W * ah / aw, 840, 1200));
  let sw, sh;
  if (aw / ah > W / H) { sh = ah; sw = ah * W / H; } else { sw = aw; sh = aw * H / W; }
  stageW = sw;
  stage.style.width = sw + 'px'; stage.style.height = sh + 'px';
  stage.style.fontSize = (sw / 27) + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(sw * dpr); cv.height = Math.round(sh * dpr);
  scale = cv.width / W;
  HOR = Math.round(H * 0.34);
  GROUND_Y = Math.round(H * 0.82);
  CAMH = (GROUND_Y - HOR) / (F / D_P);
  skyG = ctx.createLinearGradient(0, 0, 0, HOR);
  skyG.addColorStop(0, '#150f35'); skyG.addColorStop(.42, '#3a2459'); skyG.addColorStop(.8, '#b04a6a'); skyG.addColorStop(1, '#ffae6b');
  groundG = ctx.createLinearGradient(0, HOR, 0, H);
  groundG.addColorStop(0, '#231c3c'); groundG.addColorStop(1, '#2e2749');
  vigG = ctx.createRadialGradient(CX, H * .52, H * .28, CX, H * .52, H * .78);
  vigG.addColorStop(0, 'rgba(6,4,18,0)'); vigG.addColorStop(1, 'rgba(6,4,18,.5)');
  fitTitle();
}
function fitTitle() {
  const lim = stageW * .86;
  document.querySelectorAll('h1 span').forEach(sp => {
    sp.style.fontSize = '';
    const w = sp.getBoundingClientRect().width;
    if (w > lim) sp.style.fontSize = (parseFloat(getComputedStyle(sp).fontSize) * lim / w) + 'px';
  });
}

const proj = (x, y, d) => { const s = F / d; return [CX + (x - camX) * s, HOR + (CAMH - y) * s]; };
const fogA = d => d < 2800 ? 1 : d > 4300 ? 0 : (4300 - d) / 1500;

/* ================= audio ================= */
let ac = null, master = null, siren = null;
function audioInit() {
  if (!ac) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : .55; master.connect(ac.destination);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; g.gain.value = 0; o.connect(g); g.connect(master); o.start(); siren = { o, g };
    } catch (e) { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
function tone(f, dur, type, vol, to, delay) {
  if (!ac || muted) return;
  try {
    const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol || .15, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
  } catch (e) {}
}
function noise(dur, vol, freq) {
  if (!ac || muted) return;
  try {
    const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(); s.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
    const g = ac.createGain(); g.gain.value = vol || .3;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  } catch (e) {}
}
const sfx = {
  coin(c) { const m = Math.pow(1.0595, Math.min(c, 12)); tone(880 * m, .09, 'square', .06); tone(1320 * m, .14, 'square', .05, 0, .05); },
  jump() { tone(280, .18, 'triangle', .18, 620); },
  slide() { noise(.28, .22, 900); },
  move() { tone(220, .05, 'sine', .06, 150); },
  hit() { noise(.35, .5, 700); tone(110, .35, 'sawtooth', .22, 40); },
  pop() { tone(700, .2, 'sine', .2, 200); noise(.15, .2, 3000); },
  power() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'triangle', .13, 0, i * .06)); },
  busted() { noise(.6, .5, 500); tone(440, .9, 'sawtooth', .2, 70); },
  go() { tone(392, .1, 'square', .08); tone(587, .18, 'square', .08, 0, .1); }
};
function sirenUpdate() {
  if (!ac || !siren) return;
  let v = 0;
  if (!muted && (S.mode === 'play' || S.mode === 'dying')) v = .008 + .006 * S.heat + (S.copClose ? .03 : 0);
  const f = 780 + 260 * Math.sin(S.t * 3.1);
  siren.g.gain.setTargetAtTime(v, ac.currentTime, .15);
  siren.o.frequency.setTargetAtTime(f, ac.currentTime, .05);
}

/* ================= helpers: draw ================= */
function poly(p, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
  ctx.closePath(); ctx.fill();
}
function quadW(xa, xb, dA, dB, fill) { poly([proj(xa, 0, dA), proj(xb, 0, dA), proj(xb, 0, dB), proj(xa, 0, dB)], fill); }
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), 0, 0, 6.2832); ctx.fill(); }
function glow(x, y, r, col, a) {
  if (r < 1) return;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + col + ',' + a + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = 'source-over';
}
function drawBox(x, w, y0, y1, dN, dF, c) {
  dN = Math.max(dN, 90); dF = Math.max(dF, dN + 1);
  const x0 = x - w / 2, x1 = x + w / 2;
  const a = proj(x0, y1, dN), b = proj(x1, y1, dN), cc = proj(x1, y0, dN), dd = proj(x0, y0, dN);

/* ================= update ================= */
function update(dt) {
  S.t += dt;
  const p = S.p, mode = S.mode, playing = mode === 'play', dying = mode === 'dying', menu = mode === 'menu';

  // speed
  let target = 0;
  if (menu) target = 950;
  else if (playing) { const m = S.dist / 100; target = 1100 + Math.min(800, m * 1.15); if (S.nitro > 0) target *= 1.55; }
  S.speed += (target - S.speed) * Math.min(1, (dying ? 4 : 2.5) * dt);
  if (S.speed < 1) S.speed = 0;
  const dz = S.speed * dt;
  S.travel += dz;
  scrollWorld(dz);

  if (playing) {
    S.dist += dz;
    const heat = Math.min(5, 1 + Math.floor(S.dist / 100 / 250));
    if (heat > S.heat) {
      S.heat = heat; S.maxHeat = Math.max(S.maxHeat, heat);
      banner('Heat ' + heat, ['', '', 'Chopper overhead', 'Roadblocks ahead', 'Spike strips down', 'Everything they’ve got'][heat]);
    }
    if (S.magnet > 0) S.magnet = Math.max(0, S.magnet - dt);
    if (S.shield > 0) S.shield = Math.max(0, S.shield - dt);
    if (S.nitro > 0) S.nitro = Math.max(0, S.nitro - dt);
    if (S.copClose) { S.copTimer -= dt; if (S.copTimer <= 0) S.copClose = false; }
    if (S.comboT > 0) { S.comboT -= dt; if (S.comboT <= 0) S.combo = 0; }
  }
  S.score = Math.floor(S.dist / 100) + S.coins * 10 + S.bonus;

  // menu auto-runner
  if (menu) {
    S.autoT -= dt;
    if (S.autoT <= 0) { p.lane = ri(3) - 1; S.autoT = rnd(.9, 1.8); }
  }

  // player physics
  const tx = p.lane * LANE_W, dx = tx - p.x;
  p.x += dx * Math.min(1, 16 * dt);
  p.tilt += (clamp(dx / LANE_W, -1, 1) * .3 - p.tilt) * Math.min(1, 12 * dt);
  if (p.y > 0 || p.vy > 0) {
    p.vy -= GRAV * dt; p.y += p.vy * dt;
    if (p.y <= 0) {
      p.y = 0; p.vy = 0;
      dust(CX + (p.x - camX) * (F / D_P), GROUND_Y, 6);
      if (p.qSlide) { p.qSlide = false; p.slide = .7; sfx.slide(); }
      else if (p.jumpBuf > 0) { p.jumpBuf = 0; p.vy = JUMP_V; sfx.jump(); }
    }
  }
  if (p.jumpBuf > 0) p.jumpBuf -= dt;
  if (p.slide > 0) p.slide -= dt;
  if (p.inv > 0) p.inv -= dt;
  p.h = p.slide > 0 ? 62 : 175;
  p.anim += dt * (6 + S.speed / 200);
  if (dying) { p.fall = Math.min(1, p.fall + dt * 2.2); }
  camX += (p.x * .45 - camX) * Math.min(1, 6 * dt);

  // cop
  const copTarget = dying ? 296 : (S.copClose ? 268 : 228);
  S.copD += (copTarget - S.copD) * Math.min(1, 2.6 * dt);
  S.copX += (p.x - S.copX) * Math.min(1, 7 * dt);

  // spawning
  if (menu || playing) { S.spawnCD -= dz; if (S.spawnCD <= 0) spawnPattern(); }

  // entities
  const ents = S.ents;
  for (let i = ents.length - 1; i >= 0; i--) {
    const o = ents[i], prevD = o.d;
    o.d -= (S.speed + (o.vz || 0)) * dt;
    const step = prevD - o.d;
    if (o.ghost > 0) { o.ghost -= dt; o.x += o.gvx * dt; if (o.ghost <= 0) { ents[i] = ents[ents.length - 1]; ents.pop(); continue; } }
    if (o.d + (o.len || 0) / 2 < 170 || o.got || (o.kind !== 'obs' && o.d < 225)) { ents[i] = ents[ents.length - 1]; ents.pop(); continue; }
    if (o.kind === 'obs') {
      if (!o.hit && playing) {
        const half = o.len / 2;

function drawRunner(sx, sy, s, o) {

  if (o.rot) ctx.rotate(o.rot);
  const k = o.k, ph = o.t, cop = o.cop;
  const pants = cop ? '#141c44' : '#27264f', shirt = cop ? '#1f2e6b' : '#2fb6ff', shirtD = cop ? '#16214f' : '#1c8fd1';
  const shoe = cop ? '#0b0f22' : '#ffffff', skin = '#e3a77a';
  const L = 72 * k, T = 72 * k, run = !o.air && k >= .8;
  ctx.translate(0, run ? -Math.abs(Math.sin(ph)) * 5 : 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const i of [-1, 1]) {
    let fx = i * 17, fy = 0;
    if (o.air) { fy = i < 0 ? -34 : -8; fx = i * 20; }
    else if (run) { fy = -Math.max(0, Math.sin(ph + (i < 0 ? 0 : Math.PI))) * 30; }
    else fx = i * 14;
    ctx.strokeStyle = pants; ctx.lineWidth = 22;
    ctx.beginPath(); ctx.moveTo(i * 13, -L); ctx.lineTo(fx, fy - 8); ctx.stroke();
    ctx.fillStyle = shoe; ell(fx, fy - 5, 15, 9);
    ctx.fillStyle = cop ? '#000' : '#cfd0e2'; ctx.fillRect(fx - 13, fy - 2, 26, 4);
  }
  const top = -L - T;
  ctx.fillStyle = shirt; rr(-31, top, 62, T + 8, 14); ctx.fill();
  ctx.fillStyle = shirtD; ctx.fillRect(-31, top + T - 4, 62, 12);
  if (cop) {
    ctx.fillStyle = '#0a0d24'; ctx.fillRect(-31, top + T - 8, 62, 7);
    ctx.fillStyle = '#e8ecf8'; ctx.font = '900 17px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('POLICE', 0, top + T * .42, 56);
  }
  for (const i of [-1, 1]) {
    let hx = i * 44, hy = top + T * .62 + (o.air ? 0 : Math.sin(ph + (i < 0 ? Math.PI : 0)) * 14);
    if (o.air || o.up) { hx = i * 52; hy = top - 8; }
    else if (!run) { hx = i * 40; hy = top + T * .5; }
    ctx.strokeStyle = shirtD; ctx.lineWidth = 17; ctx.beginPath(); ctx.moveTo(i * 30, top + 14); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hx, hy, 8, 0, 6.2832); ctx.fill();
    if (cop && i > 0) { ctx.strokeStyle = '#0c0c14'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 8, hy - 36); ctx.stroke(); }
  }
  if (!cop) {
    const by = top + T * .55 + (run ? Math.sin(ph * 2) * 3 : 0);
    ctx.save(); ctx.translate(10, by); ctx.rotate(.12 * Math.sin(ph));
    ctx.fillStyle = '#e0aa45'; ell(0, 0, 27, 32);
    ctx.fillStyle = '#bf8a2c'; ell(9, 4, 15, 26);
    ctx.fillStyle = '#e0aa45'; ctx.beginPath(); ctx.moveTo(-12, -28); ctx.lineTo(12, -28); ctx.lineTo(4, -46); ctx.lineTo(-4, -46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a4d12'; rr(-10, -32, 20, 8, 3); ctx.fill();
    ctx.fillStyle = '#5a3a0b'; ctx.font = '900 32px "Big Shoulders Display",Impact,sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', -1, 4);
    ctx.restore();
    ctx.fillStyle = shirtD; ell(0, top - 20, 25, 25);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, top - 44); ctx.lineTo(0, top - 6); ctx.stroke();
    ctx.fillStyle = shirt; ell(0, top - 28, 21, 15);
  } else {
    ctx.fillStyle = '#2a1d17'; ell(0, top - 20, 21, 21);
    ctx.fillStyle = skin; ctx.fillRect(-9, top - 4, 18, 9);
    ctx.fillStyle = '#1b2a63'; ell(0, top - 28, 25, 18);
    ctx.fillStyle = '#0d1230'; ctx.fillRect(-25, top - 25, 50, 6);
  }
  ctx.restore();
}
function drawPlayer() {
  const p = S.p, s = F / D_P, sx = CX + (p.x - camX) * s, gy = GROUND_Y;
  const sh = 1 - Math.min(.6, p.y / 200);
  ctx.fillStyle = 'rgba(0,0,0,' + (.38 * sh) + ')'; ell(sx, gy, 44 * s * sh, 15 * s * sh);
  if (S.nitro > 0) glow(sx, gy - 80 * s, 150 * s, '255,150,40', .5);
  const down = S.mode === 'dying' || S.mode === 'over';
  const blink = p.inv > 0 && S.mode === 'play' && Math.floor(S.t * 14) % 2 === 0;
  if (blink) ctx.globalAlpha = .35;
  drawRunner(sx, gy - p.y * s, s, { t: p.anim, k: down ? 1 - .55 * p.fall : (p.slide > 0 ? .45 : 1), air: p.y > 2, rot: down ? p.fall * .7 : p.tilt, cop: false });
  ctx.globalAlpha = 1;
  const cy = gy - p.y * s - 90 * s;
  if (S.shield > 0) {
    const r = 112 * s * (1 + .03 * Math.sin(S.t * 6));
    const g = ctx.createRadialGradient(sx, cy, r * .55, sx, cy, r);
    g.addColorStop(0, 'rgba(86,200,255,0)'); g.addColorStop(1, 'rgba(86,200,255,.5)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, cy, r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(190,235,255,.8)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(sx, cy, r * .82, 3.6, 4.6); ctx.stroke();
  }
  if (S.magnet > 0) {
    const t = (S.t * 1.4) % 1;
    ctx.strokeStyle = 'rgba(255,90,110,' + (.5 * (1 - t)) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(sx, cy, (60 + t * 120) * s, 0, 6.2832); ctx.stroke();
  }
}
function drawCop() {
  const s0 = F / S.copD, sx = CX + (S.copX - camX) * s0, gy = HOR + CAMH * s0, s = s0 * .88;
  ctx.fillStyle = 'rgba(0,0,0,.38)'; ell(sx, gy, 44 * s, 15 * s);
  drawRunner(sx, gy, s, { t: S.t * (6 + S.speed / 200) * .95 + 1.3, k: 1, air: false, rot: 0, cop: true, up: S.mode === 'dying' || S.mode === 'over' });
}

function drawParts() {
  for (const q of S.parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.col;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
}

const ITEMS = [], PLAYER_ITEM = { kind: 'player', d: D_P }, COP_ITEM = { kind: 'cop', d: 228 };
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (S.shake > .3 && !RM) ctx.translate((Math.random() - .5) * S.shake, (Math.random() - .5) * S.shake);
  drawSky(); drawRoad(); drawBuildings(); drawLamps(); drawSearch();
  ITEMS.length = 0;
  for (const o of S.ents) if (o.d > 130 && o.d < SPAWN_D + 1500) ITEMS.push(o);
  PLAYER_ITEM.d = D_P; COP_ITEM.d = S.copD; ITEMS.push(PLAYER_ITEM, COP_ITEM);
  ITEMS.sort((a, b) => b.d - a.d);
  for (const o of ITEMS) {
    if (o.kind === 'player') drawPlayer();
    else if (o.kind === 'cop') drawCop();
    else if (o.kind === 'coin') drawCoin(o);
    else if (o.kind === 'pu') drawPU(o);
    else drawObs(o);
  }
  drawParts();
  ctx.restore();

  // overlays
  if (S.mode !== 'menu') {
    const inten = (.05 + .035 * S.heat + (S.copClose ? .12 : 0)) * (S.mode === 'over' ? .6 : 1);
    const a1 = inten * (RM ? .5 : .5 + .5 * Math.sin(S.t * 9)), a2 = inten * (RM ? .5 : .5 + .5 * Math.sin(S.t * 9 + Math.PI));
    ctx.globalCompositeOperation = 'lighter';
    let g = ctx.createRadialGradient(0, H, 0, 0, H, 460);
    g.addColorStop(0, 'rgba(255,40,60,' + a1 + ')'); g.addColorStop(1, 'rgba(255,40,60,0)');
    ctx.fillStyle = g; ctx.fillRect(0, H - 480, 480, 480);
    g = ctx.createRadialGradient(W, H, 0, W, H, 460);
    g.addColorStop(0, 'rgba(63,140,255,' + a2 + ')'); g.addColorStop(1, 'rgba(63,140,255,0)');
    ctx.fillStyle = g; ctx.fillRect(W - 480, H - 480, 480, 480);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (S.nitro > 0 && !RM) {
    ctx.strokeStyle = 'rgba(255,240,200,.35)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i < 26; i++) {
      const ang = i * .2417 + 1.1, f = (S.t * 2.4 + i * .37) % 1, r0 = 130 + f * 520, r1 = r0 + 40 + f * 140, cy = HOR + 80;
      ctx.moveTo(CX + Math.cos(ang) * r0, cy + Math.sin(ang) * r0 * 1.1); ctx.lineTo(CX + Math.cos(ang) * r1, cy + Math.sin(ang) * r1 * 1.1);
    }
    ctx.stroke();
  }
  ctx.fillStyle = vigG; ctx.fillRect(0, 0, W, H);
  if (S.flash > 0) { ctx.fillStyle = 'rgba(' + S.flashCol + ',' + (S.flash * .45) + ')'; ctx.fillRect(0, 0, W, H); }
}

/* ================= loop & boot ================= */
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.033, Math.max(0, (now - last) / 1000)); last = now;
  if (window.innerWidth !== lastW || window.innerHeight !== lastH) fit();
  if (S.mode !== 'pause') update(dt);
  draw();
  if (S.mode === 'play' || S.mode === 'dying' || S.mode === 'pause') hud();
}
function init() {
  fit(); addEventListener('resize', fit);
  fillWorld(); resetRun(); S.speed = 950;
  el.mBest.textContent = best.toLocaleString();
  for (let i = 0; i < 60; i++) update(1 / 30);
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fitTitle).catch(() => {}); }
  window.__siren = { S, startRun, laneMove, doJump, doSlide, update, draw };
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ best }));
const boot = data => { if (data && typeof data.best === 'number' && data.best > best) best = data.best; init(); };
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
